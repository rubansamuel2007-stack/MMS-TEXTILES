<article class="product-card"><a class="product-image" href="{{ url_for('product_detail', product_id=p.id) }}">{% if p.image %}<img src="{{ url_for('static', filename='uploads/' + p.image) }}" alt="{{ p.name }}">{% else %}<div class="image-placeholder">MMS<br>TEXTILES</div>{% endif %}{% if p.new_arrival %}<span class="badge">NEW</span>{% endif %}</a><div class="product-info"><small>{{ p.category_name or 'Collection' }}</small><h3><a href="{{ url_for('product_detail', product_id=p.id) }}">{{ p.name }}</a></h3><strong>₹{{ "%.2f"|format(p.price) }}</strong><div class="card-actions"><a class="button button-small button-outline-dark" href="{{ url_for('product_detail', product_id=p.id) }}">View Details</a><a class="button button-small button-red" target="_blank" href="https://wa.me/{{ whatsapp }}?text={{ ('Hello MMS Textiles! I am interested in ' ~ p.name ~ ' priced at ₹' ~ p.price ~ '. Please share more details. Product page: ' ~ request.url_root ~ 'product/' ~ p.id)|urlencode }}">Enquire</a></div></div></article>
