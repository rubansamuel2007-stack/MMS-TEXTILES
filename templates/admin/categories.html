{% extends "admin/base_admin.html" %}{% block admin_content %}<h1>Manage Categories</h1><form class="inline-form" method="post"><input name="name" placeholder="New category name" required><button class="button button-red">Add Category</button></form><div class="table-wrap"><table><tr><th>Category</th><th>Action</th></tr>{% for c in categories %}<tr><td>{{ c.name }}</td><td><form method="post" action="{{ url_for('delete_category',category_id=c.id) }}" onsubmit="return confirm('Delete category?')"><button class="link-danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
