{% extends "admin/base_admin.html" %}{% block admin_content %}<h1>Manage Offers</h1><form class="admin-form" method="post"><label>Offer title<input name="title" required></label><label>Description<input name="description"></label><button class="button button-red">Add Offer</button></form><div class="table-wrap"><table><tr><th>Title</th><th>Description</th><th>Active</th><th>Actions</th></tr>{% for o in offers %}<tr><td>{{ o.title }}</td><td>{{ o.description }}</td><td>{{ 'Yes' if o.active else 'No' }}</td><td><form method="post" action="{{ url_for('toggle_offer',offer_id=o.id) }}" class="inline-form"><button class="link-button">{{ 'Deactivate' if o.active else 'Activate' }}</button></form><form method="post" action="{{ url_for('delete_offer',offer_id=o.id) }}" onsubmit="return confirm('Delete offer?')"><button class="link-danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
