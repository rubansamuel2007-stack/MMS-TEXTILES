{% extends "admin/base_admin.html" %}{% block admin_content %}<h1>{{ 'Edit Product' if product else 'Add Product' }}</h1><form class="admin-form" method="post" enctype="multipart/form-data"><label>Product name<input name="name" required value="{{ product.name if product else '' }}"></label><label>Category<select name="category_id"><option value="">Choose category</option>{% for c in categories %}<option value="{{ c.id }}" {% if product and product.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Price (₹)<input type="number" name="price" min="0" step="0.01" required value="{{ product.price if product else '' }}"></label><label>Description<textarea name="description" rows="5">{{ product.description if product else '' }}</textarea></label><label>Product image (JPG, PNG, WEBP · max 5 MB)<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"></label>{% if product and product.image %}<p>Current image: <img class="table-thumb" src="{{ url_for('static',filename='uploads/'+product.image) }}"></p>{% endif %}<label class="check"><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}> Featured product</label><label class="check"><input type="checkbox" name="new_arrival" {% if product and product.new_arrival %}checked{% endif %}> New arrival</label><label class="check"><input type="checkbox" name="available" {% if not product or product.available %}checked{% endif %}> Visible on website</label><button class="button button-red">Save Product</button><a class="button button-outline-dark" href="{{ url_for('admin_products') }}">Cancel</a></form>{% endblock %}
